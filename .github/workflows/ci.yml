name: CI — Tests, Lint & Production Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Test, Typecheck, Rules Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Audit Firestore security rules
        run: npx eslint firestore.rules

      - name: Build production bundle
        run: npm run build
